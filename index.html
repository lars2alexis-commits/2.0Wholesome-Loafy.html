<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wholesome Loafy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* THEME TOKENS: change colours, fonts, radius here. No business logic lives in this block. */
:root{--cream:#faf5ea;--oat:#efe5d0;--oat2:#e4d6b9;--caramel:#b5693a;--caramel-d:#955329;--sage:#8da38a;--sage-d:#4f6a4c;--espresso:#3a2a20;--mut:#6f5f50;--line:#e2d5bb;--bad:#9c3d2a;--r:16px;--font-head:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;--pad:clamp(16px,3vw,32px);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:auto}html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1,h2,h3{font-family:var(--font-head);font-weight:600;line-height:1.15;letter-spacing:-.01em}h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:0 0 6px}

.menu{position:relative}.menu div{position:absolute;right:0;top:130%;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:190px;box-shadow:0 12px 30px #3a2a2022;display:grid}.menu div a{padding:7px 10px;border-radius:8px}.menu div a:hover{background:var(--oat)}

.ph,.sl img,.pimgw img,.pdimg img{width:100%;height:100%;object-fit:cover;display:block}

.ph0{--c1:#c58a52;--c2:#8c5a34}.ph1{--c1:#a8b58a;--c2:#d9b872}.ph2{--c1:#d7a574;--c2:#a86a3b}.ph3{--c1:#e7cfa0;--c2:#b58f66}
.ov{position:absolute;left:0;right:0;bottom:0;padding:clamp(20px,4vw,44px) clamp(20px,4vw,44px) 64px;background:linear-gradient(0deg,#2a1a0fcc,#2a1a0f00);color:#fff;z-index:2}
.ov h1{font-size:clamp(1.8rem,4.2vw,3.2rem);margin:0 0 16px;max-width:15ch;color:#fff}
.ar{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;padding:0;background:#faf5eae6;color:var(--espresso);font-size:1.5rem;line-height:1}.ar.l{left:12px}.ar.r{right:12px}.ar:hover{background:#fff}
.dots{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:8px;align-items:center;z-index:3}
.dots .d{width:10px;height:10px;border-radius:50%;padding:0;background:#fff8;border:0}.dots .d.on{background:#fff;width:24px;border-radius:6px;transition:width .3s}.dots .pz{background:#faf5eae6;color:var(--espresso);padding:2px 10px;font-size:.78rem;border-radius:99px}
.panel{display:flex;flex-direction:column;gap:14px}
.stat{background:var(--oat);border-radius:var(--r);padding:16px 18px;border-left:5px solid var(--sage)}.stat.shut{border-left-color:var(--caramel)}
.stat b.t{font:600 1.1rem var(--font-head);display:block}.stat .cdw{margin-top:6px;font-weight:700;color:var(--sage-d)}.stat.shut .cdw{color:var(--caramel-d)}
.pl{display:flex;flex-direction:column}.pl a{padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--espresso);display:flex;justify-content:space-between;gap:10px;transition:padding .2s,color .2s}.pl a:hover{padding-left:12px;color:var(--caramel-d)}
.pl a b{font:600 1.15rem var(--font-head)}.pl a span{color:var(--mut);font-size:.88rem;text-align:right;align-self:center}
.cartb{display:flex;justify-content:center;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--espresso);color:#fff;border:0;font-weight:700}.cartb:hover{background:#000}
section.shopS{padding:clamp(40px,6vw,72px) 0 10px}section.shopS>p{margin:0 0 24px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:clamp(16px,2.4vw,28px)}
.pc{display:flex;flex-direction:column;gap:6px}.pc h3{margin:8px 0 0;font-size:1.25rem}.pc p{margin:0;color:var(--mut);font-size:.95rem}
.pimgw{aspect-ratio:4/5;border-radius:18px;overflow:hidden;cursor:pointer;background:var(--oat)}.pimgw .ph,.pimgw img{transition:transform .6s ease}.pimgw:hover .ph,.pimgw:hover img{transform:scale(1.05)}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:2px}.meta b{font:600 1.15rem var(--font-head)}
.stk{font-size:.85rem;font-weight:500;color:var(--sage-d)}.stk.low{color:var(--caramel-d)}.stk.out{color:var(--bad)}
.pc button{margin-top:auto}
button,.btn{font:600 .95rem var(--font-body);background:var(--caramel);color:#fff;border:0;border-radius:99px;padding:10px 20px;cursor:pointer;transition:background .2s,transform .15s}button:hover{background:var(--caramel-d)}button:active{transform:scale(.98)}
button.alt{background:transparent;color:var(--caramel-d);border:1.5px solid var(--caramel)}button.alt:hover{background:var(--oat)}button.sm{padding:3px 11px;font-size:.85rem}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--espresso);background:#fffaf0;border:1px solid var(--oat2);border-radius:10px;padding:8px 10px;max-width:100%}textarea{width:100%}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:500}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:start}.pdimg{aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--oat)}
.pdi h1{font-size:clamp(1.8rem,3.4vw,2.6rem);margin:0}.price{font:600 1.5rem var(--font-head);color:var(--caramel-d);margin:4px 0 10px}
.opt{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.opt label{border:1.5px solid var(--oat2);border-radius:99px;padding:6px 16px;cursor:pointer}.opt label:has(input:checked){border-color:var(--caramel);background:var(--oat)}.opt input{accent-color:var(--caramel)}
.acc{margin-top:36px;max-width:820px}details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font:600 1.1rem var(--font-head)}.alg{background:#f5e3d0;border-radius:10px;padding:10px 14px}
.card{background:#fffaf0;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.warn{color:var(--bad)}.ok{color:var(--sage-d)}.mut{color:var(--mut);font-size:.92rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.x{overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.bar{padding:8px 16px;border-radius:99px;margin-bottom:18px;background:var(--oat);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:.92rem}
.th{width:64px;height:64px;border-radius:10px;overflow:hidden}.th .ph i{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--espresso);color:#fff;padding:12px 20px;border-radius:14px;z-index:20;display:none;box-shadow:0 10px 30px #0004;max-width:92vw}#toast a{color:#f1c9a3;font-weight:700}
.foot{margin-top:40px;color:var(--mut);font-size:.85rem}
#demo{position:fixed;right:12px;bottom:12px;width:min(370px,calc(100vw - 24px));background:var(--espresso);color:#f6ecda;border-radius:14px;z-index:9;padding:4px 12px;max-height:75vh;overflow:auto;font-size:.82rem;box-shadow:0 8px 24px #0004}
#demo summary{font:500 .82rem var(--font-body);padding:6px 0}#demo p{color:#cdbba3}#demo button{margin:2px;background:var(--sage);color:#1c140e;padding:5px 10px;font-size:.8rem}#demo button.r{background:#e0a77a}#tests div{padding:2px 0}
@media(max-width:860px){.hero,.pd{grid-template-columns:1fr}.car{min-height:380px}.menu div{right:auto;left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header id="nav"></header><main id="app"></main><div id="toast" role="status"></div>
<div id="demo"><details><summary>Testing panel · <span id="dclk"></span></summary>
<p class="mut" style="color:#c9b79f">Simulated Singapore clock, separate from the real one. Jumps are relative to the current simulated week.</p>
<div><b>Clock:</b>
<button onclick="jump(0,0,0)">Mon 12:00 AM</button><button onclick="jump(0,0,1)">Mon 12:01 AM</button><button onclick="jump(2,12,0)">Wed noon</button><button onclick="jump(4,23,59)">Fri 11:59 PM</button><button onclick="jump(5,0,0)">Sat 12:00 AM</button><button onclick="jump(6,10,0)">Sunday</button><button onclick="jump(7,0,1)">Next Mon 12:01 AM</button><button onclick="jump(8,9,0)">Next Tue</button><button onclick="adv(1)">+1 min</button><button onclick="adv(60)">+1 hr</button><button onclick="useReal()">Use real clock</button></div>
<div><b>Stock:</b><button onclick="setLeft('sourdough',3)">Sourdough: 3 left</button><button onclick="setLeft('sourdough',0)">Sell out sourdough</button><button onclick="rival(2)">Other customer buys 2 sourdough</button><button onclick="togglePause()" class="r">Admin pause/resume</button></div>
<div><b>Checks:</b><button onclick="runTests()">Run all automated scenario checks</button><button class="r" onclick="if(confirm('Reset all demo data?')){S=defaults();save();go()}">Reset all data</button></div>
<div id="tests"></div></details></div>
<script>
const DY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],D=864e5,KEY='wl_v1';
const SAMPLE='Sample content, edit in Admin.';
const mk=(id,name,price,emoji,slice,desc,fl,sv,ing,al)=>({id,name,price,cap:20,emoji,slice,desc,recipe:'',info:{flavour:fl,serving:sv,ingredients:ing,nutrition:'Not yet provided. Add values from a verified source before publishing.',allergens:al,storage:'Sample: best enjoyed fresh. Add your own storage and reheating guidance.',preorder:'Orders open Mon 12:01 AM to Fri 11:59 PM (SGT). Baked Sunday. Pickup Sun or Mon; delivery Sun only.'}});
function defaults(){return{demo:true,sim:Date.UTC(2026,9,26,9,0),settings:{paused:false,msg:'Our bakery is taking a short break!',pauseWeeks:[],fee:4,pickupTimes:'Sun 2–6 PM; Mon 6–9 PM (sample, edit)',delHours:'Sun 12–5 PM (sample, edit)',area:'Sample: central Singapore (edit)'},
products:[mk('sourdough','Signature Sourdough Loaf',12,'🍞',true,'Our slow-fermented everyday loaf.',SAMPLE+' Tangy, crisp crust, open chewy crumb.',SAMPLE+' Weight and servings to be confirmed.',SAMPLE+' e.g. flour, water, salt, starter (confirm).','Sample: contains wheat (gluten). Confirm full list.'),
mk('focaccia','Rosemary Focaccia',10,'🌿',false,'Olive-oil rich, rosemary-scented flatbread.',SAMPLE+' Soft, dimpled, herby.',SAMPLE,SAMPLE+' Confirm.','Sample: contains wheat (gluten). Confirm full list.'),
mk('cinnamon','Homemade Cinnamon Rolls',8,'🥐',false,'Soft rolls swirled with cinnamon.',SAMPLE+' Sweet, spiced, pillowy.',SAMPLE,SAMPLE+' Confirm.','Sample: likely wheat, milk, egg. Confirm full list.')],
batches:{},orders:[],cart:[],points:{},seq:1,email:'',view:'home',arg:'',tab:'orders'}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.products)S=defaults();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>S.demo?S.sim:Date.now()+8*36e5;
const iso=ms=>new Date(ms).toISOString().slice(0,10);
const fd=i=>{const d=new Date(i+'T00:00:00Z');return DY[d.getUTCDay()]+', '+d.getUTCDate()+' '+MO[d.getUTCMonth()]};
const ft=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return DY[d.getUTCDay()]+' '+d.getUTCDate()+' '+MO[d.getUTCMonth()]+' '+d.getUTCFullYear()+', '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+' SGT'};
const prod=id=>S.products.find(p=>p.id==id);
const addD=(i,n)=>iso(Date.parse(i+'T00:00:00Z')+n*D);
function cycle(t){const d=(new Date(t).getUTCDay()+6)%7,mon=t-t%D-d*D,openAt=mon+6e4,closeAt=mon+5*D,sunday=iso(mon+6*D);
const paused=S.settings.paused||S.settings.pauseWeeks.includes(sunday),sched=t>=openAt&&t<closeAt;
return{mon,sunday,sched,paused,open:sched&&!paused,next:sched?closeAt:(t<openAt?openAt:mon+7*D+6e4),label:sched?'Orders close in':'Orders open in'}}
function getBatch(sun){const b=S.batches[sun]=S.batches[sun]||{};S.products.forEach(p=>{if(!b[p.id])b[p.id]={cap:p.cap,sold:0}});return b} // idempotent: created once per Sunday, never carries over
const rem=(pid,sun)=>{const b=getBatch(sun)[pid];return Math.max(0,b.cap-b.sold)};
function placeOrder(cart,f,cust,rw){ // "server-side" order logic: re-validates everything
const c=cycle(now());
if(c.paused)return{ok:0,msg:S.settings.msg+' Ordering is paused.'};
if(!c.sched)return{ok:0,msg:'Ordering is closed. It reopens Monday 12:01 AM (Singapore time).'};
if(!cart.length)return{ok:0,msg:'Your cart is empty.'};
if(!cust.name||!cust.email)return{ok:0,msg:'Please enter your name and email.'};
if(f.type==='delivery'&&(f.day!=='sun'||!f.addr))return{ok:0,msg:'Delivery is Sunday only and needs an address.'};
const need={};cart.forEach(l=>need[l.pid]=(need[l.pid]||0)+l.qty);
for(const pid in need){const r=rem(pid,c.sunday);if(need[pid]>r)return{ok:0,msg:r?`Only ${r} left of ${prod(pid).name}, but you asked for ${need[pid]}. Reduce the quantity.`:`${prod(pid).name} is sold out for this week.`}}
const items=cart.map(l=>({pid:l.pid,name:prod(l.pid).name,slice:l.slice,qty:l.qty,price:prod(l.pid).price}));
const sub=items.reduce((a,i)=>a+i.price*i.qty,0),bal=S.points[cust.email]||0;let disc=0,cost=0;
if(rw==='r5'){cost=50;disc=5}else if(rw==='r10'){cost=100;disc=10}else if(rw&&rw.startsWith('free:')){cost=200;const p=items.find(i=>i.pid==rw.slice(5));if(!p)return{ok:0,msg:'Add the free-item product to your cart first.'};disc=p.price}
if(cost>bal)return{ok:0,msg:`Not enough points (${bal}).`};disc=Math.min(disc,sub);
const fee=f.type==='delivery'?+S.settings.fee:0,pts=Math.floor(sub-disc);
for(const pid in need)getBatch(c.sunday)[pid].sold+=need[pid]; // atomic: validate+deduct in one synchronous step
S.points[cust.email]=bal-cost+pts;
const o={id:'WL'+String(S.seq++).padStart(4,'0'),sun:c.sunday,placed:ft(now()),items,fulfil:f,name:cust.name,email:cust.email,sub,disc,fee,total:sub-disc+fee,status:'confirmed',pts,cost};
S.orders.push(o);save();return{ok:1,order:o}}
function setStatus(id,st){const o=S.orders.find(x=>x.id==id);if(!o||o.status===st)return;
if(st==='cancelled'&&o.status!=='cancelled'){if(iso(now())<=o.sun){const b=getBatch(o.sun);o.items.forEach(i=>b[i.pid].sold-=i.qty)}S.points[o.email]=(S.points[o.email]||0)-o.pts+o.cost}
if(o.status==='cancelled'&&st!=='cancelled'){const b=getBatch(o.sun);const need={};o.items.forEach(i=>need[i.pid]=(need[i.pid]||0)+i.qty);for(const k in need)if(need[k]>rem(k,o.sun))return alert('Not enough stock to reinstate.');o.items.forEach(i=>b[i.pid].sold+=i.qty);S.points[o.email]=(S.points[o.email]||0)+o.pts-o.cost}
o.status=st;save();go()}
const go=(v,a)=>{if(v){S.view=v;S.arg=a||'';scrollTo(0,0)}save();render()};
function jump(d,h,m){S.demo=true;S.sim=cycle(now()).mon+d*D+(h*60+m)*6e4;go()}
const adv=m=>{S.demo=true;S.sim+=m*6e4;go()};
function useReal(){S.demo=false;go()}
function setLeft(pid,n){const c=cycle(now()),b=getBatch(c.sunday)[pid];b.sold=Math.max(0,b.cap-n);go()}
function rival(n){const r=placeOrder([{pid:'sourdough',slice:'whole',qty:n}],{type:'pickup',day:'sun'},{name:'Other customer',email:'other@demo.sg'},'');alert(r.ok?'Another customer bought '+n+' sourdough.':r.msg);go()}
function togglePause(){S.settings.paused=!S.settings.paused;go()}
// ---------- UI (presentation layer: reads state, calls the logic above) ----------
const money=n=>'S$'+(+n).toFixed(2).replace(/\.00$/,'');
function cd(){const t=now(),c=cycle(t);let s=Math.max(0,Math.floor((c.next-t)/1e3)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m '+s%60+'s'}
const ensure=()=>{S.slides=S.slides||['Signature sourdough','Rosemary focaccia','Cinnamon rolls','Our cosy kitchen'].map(cap=>({cap,img:''}));S.club=S.club||[]};
const imgH=(src,label,i)=>src?`<img src="${src}" alt="${esc(label)}">`:`<div class="ph ph${(i||0)%4}" role="img" aria-label="${esc(label)} photo placeholder"><i>Photo placeholder: replace in Admin</i></div>`;
function statusBar(){const c=cycle(now());
if(c.paused)return`<div class="bar"><b class="warn">${esc(S.settings.msg)}</b><span class="mut">Ordering is paused. Browsing is still open.</span></div>`;
return`<div class="bar"><b class="${c.open?'ok':'warn'}">${c.open?'Orders open':'Orders closed'}</b><span>${c.label} <b class="cd">${cd()}</b></span><span class="mut">${fd(c.sunday)} bake</span></div>`}
function statusPanel(c){let t,sub,lab=c.label;
if(c.paused){t=esc(S.settings.msg);sub='Browsing is open, but ordering is paused for now.';lab=''}
else if(c.open){t='Orders open: this week’s Sunday bake';sub='Pre-orders close Friday at 11:59 PM. Baking on '+fd(c.sunday)+'.'}
else{t='Our ovens are getting ready!';sub='Orders reopen Monday at 12:01 AM.'}
return`<div class="stat ${c.open?'':'shut'}" aria-live="polite"><b class="t">${t}</b><span>${sub}</span>${lab?`<div class="cdw">${lab} <span class="cd">${cd()}</span></div>`:''}</div>`}
const reopenMsg=c=>c.paused?esc(S.settings.msg):'Pre-orders reopen Monday at 12:01 AM.';
// View-Only Mode is a DISPLAY rule only: it never writes to S.batches, so real stock is preserved.
function avail(p){const c=cycle(now()),r=rem(p.id,c.sunday);
if(!c.open)return{r,closed:true,cls:'out',txt:'Ordering Closed — 0 Available to Order'};
return{r,cls:r===0?'out':r<=5?'low':'',txt:r===0?'Sold Out for This Week':r<=5?(p.id=='sourdough'?`Only ${r} loaves left for this week’s bake!`:`Only ${r} left for this week’s bake!`):`${r} left this week`}}
const btnLabel=(p,c)=>c.open&&rem(p.id,c.sunday)>0?'View & Order':'View Details';
const cardP=(p,i)=>{const a=avail(p),c=cycle(now()),L=btnLabel(p,c);return`<article class="pc"><div class="pimgw" role="link" tabindex="0" aria-label="View ${esc(p.name)}" onclick="go('product','${p.id}')" onkeydown="if(event.key=='Enter')go('product','${p.id}')">${imgH(p.img,p.name,i)}</div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="meta"><b>${money(p.price)}</b><span class="stk ${a.cls}">${a.txt}</span></div>${a.closed?`<p class="mut">${reopenMsg(c)}</p>`:''}<button class="${L=='View Details'?'alt':''}" onclick="go('product','${p.id}')">${L.replace('&','&amp;')}</button></article>`};
const bag='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 016 0"/></svg>';
const cartN=()=>S.cart.reduce((a,l)=>a+l.qty,0);
