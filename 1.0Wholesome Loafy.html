<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wholesome Loafy</title>
<style>
:root{--bg:#f6efe2;--card:#fbf7ee;--ink:#3b2a1e;--mut:#7a6a5a;--br:#8a5a3c;--sage:#7d9378;--line:#e0d3bd;--bad:#a8432f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#241b14;--card:#2e231a;--ink:#f1e6d3;--mut:#b9a68f;--br:#d39a70;--sage:#9bb396;--line:#463627;--bad:#e5836c}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,'Times New Roman',serif;padding-bottom:70px}
h1,h2,h3{font-weight:600;line-height:1.2}a{color:var(--br);cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav b{font-size:1.3rem;color:var(--br);margin-right:auto;cursor:pointer}nav a{text-decoration:none;color:var(--ink);font-size:.95rem}nav a.on{border-bottom:2px solid var(--sage)}
main{max-width:980px;margin:auto;padding:20px}
.bar{padding:10px 16px;border-radius:8px;margin-bottom:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.bar.open{border-left:6px solid var(--sage)}.bar.shut{border-left:6px solid var(--bad)}
.hero{padding:44px 20px;border-radius:14px;background:linear-gradient(135deg,#e7d9bd,#cfd8c5);color:#3b2a1e;margin-bottom:24px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 8px;max-width:14ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.pic{height:110px;border-radius:8px;background:linear-gradient(135deg,#e7d9bd,#d9cfae);display:grid;place-items:center;font-size:3.2rem;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--br);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}button.alt{background:transparent;color:var(--br);border:1px solid var(--br)}button:disabled{opacity:.45;cursor:not-allowed}button.sm{padding:3px 9px;font-size:.85rem}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}textarea{width:100%}
.warn{color:var(--bad)}.ok{color:var(--sage)}.mut{color:var(--mut);font-size:.9rem}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.x{overflow-x:auto}
#demo{position:fixed;bottom:0;left:0;right:0;background:#2e231a;color:#f1e6d3;z-index:9;padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto;font-size:.88rem}
#demo summary{font-weight:400}#demo button{margin:2px;background:#7d9378;color:#1c140e;padding:5px 9px;font-size:.82rem}#demo button.r{background:#d39a70}
#tests div{padding:2px 0}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<div id="demo"><details><summary>Demo and testing mode · <span id="dclk"></span></summary>
<p class="mut" style="color:#c9b79f">Simulated Singapore clock, separate from the real one. Jumps are relative to the current simulated week.</p>
<div><b>Clock:</b>
<button onclick="jump(0,0,0)">Mon 12:00 AM</button><button onclick="jump(0,0,1)">Mon 12:01 AM</button><button onclick="jump(2,12,0)">Wed noon</button><button onclick="jump(4,23,59)">Fri 11:59 PM</button><button onclick="jump(5,0,0)">Sat 12:00 AM</button><button onclick="jump(6,10,0)">Sunday</button><button onclick="jump(7,0,1)">Next Mon 12:01 AM</button><button onclick="jump(8,9,0)">Next Tue</button><button onclick="adv(1)">+1 min</button><button onclick="adv(60)">+1 hr</button><button onclick="useReal()">Use real clock</button></div>
<div><b>Stock:</b><button onclick="setLeft('sourdough',3)">Sourdough: 3 left</button><button onclick="setLeft('sourdough',0)">Sell out sourdough</button><button onclick="rival(2)">Other customer buys 2 sourdough</button><button onclick="togglePause()" class="r">Admin pause/resume</button></div>
<div><b>Checks:</b><button onclick="runTests()">Run all automated scenario checks</button><button class="r" onclick="if(confirm('Reset all demo data?')){S=defaults();save();go()}">Reset all data</button></div>
<div id="tests"></div></details></div>
<script>
const DY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],D=864e5,KEY='wl_v1';
const SAMPLE='Sample content, edit in Admin.';
const mk=(id,name,price,emoji,slice,desc,fl,sv,ing,al)=>({id,name,price,cap:20,emoji,slice,desc,recipe:'',info:{flavour:fl,serving:sv,ingredients:ing,nutrition:'Not yet provided. Add values from a verified source before publishing.',allergens:al,storage:'Sample: best enjoyed fresh. Add your own storage and reheating guidance.',preorder:'Orders open Mon 12:01 AM to Fri 11:59 PM (SGT). Baked Sunday. Pickup Sun or Mon; delivery Sun only.'}});
function defaults(){return{demo:true,sim:Date.UTC(2026,9,26,9,0),settings:{paused:false,msg:'Our bakery is taking a short break!',pauseWeeks:[],fee:4,pickupTimes:'Sun 2–6 PM; Mon 6–9 PM (sample, edit)',delHours:'Sun 12–5 PM (sample, edit)',area:'Sample: central Singapore (edit)'},
products:[mk('sourdough','Signature Sourdough Loaf',12,'🍞',true,'Our slow-fermented everyday loaf.',SAMPLE+' Tangy, crisp crust, open chewy crumb.',SAMPLE+' Weight and servings to be confirmed.',SAMPLE+' e.g. flour, water, salt, starter (confirm).','Sample: contains wheat (gluten). Confirm full list.'),
mk('focaccia','Rosemary Focaccia',10,'🌿',false,'Olive-oil rich, rosemary-scented flatbread.',SAMPLE+' Soft, dimpled, herby.',SAMPLE,SAMPLE+' Confirm.','Sample: contains wheat (gluten). Confirm full list.'),
mk('cinnamon','Homemade Cinnamon Rolls',8,'🥐',false,'Soft rolls swirled with cinnamon.',SAMPLE+' Sweet, spiced, pillowy.',SAMPLE,SAMPLE+' Confirm.','Sample: likely wheat, milk, egg. Confirm full list.')],
batches:{},orders:[],cart:[],points:{},seq:1,email:'',view:'home',arg:'',tab:'orders'}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.products)S=defaults();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>S.demo?S.sim:Date.now()+8*36e5;
const iso=ms=>new Date(ms).toISOString().slice(0,10);
const fd=i=>{const d=new Date(i+'T00:00:00Z');return DY[d.getUTCDay()]+', '+d.getUTCDate()+' '+MO[d.getUTCMonth()]};
const ft=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return DY[d.getUTCDay()]+' '+d.getUTCDate()+' '+MO[d.getUTCMonth()]+' '+d.getUTCFullYear()+', '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+' SGT'};
const prod=id=>S.products.find(p=>p.id==id);
const addD=(i,n)=>iso(Date.parse(i+'T00:00:00Z')+n*D);
function cycle(t){const d=(new Date(t).getUTCDay()+6)%7,mon=t-t%D-d*D,openAt=mon+6e4,closeAt=mon+5*D,sunday=iso(mon+6*D);
const paused=S.settings.paused||S.settings.pauseWeeks.includes(sunday),sched=t>=openAt&&t<closeAt;
return{mon,sunday,sched,paused,open:sched&&!paused,next:sched?closeAt:(t<openAt?openAt:mon+7*D+6e4),label:sched?'Orders close in':'Orders open in'}}
function getBatch(sun){const b=S.batches[sun]=S.batches[sun]||{};S.products.forEach(p=>{if(!b[p.id])b[p.id]={cap:p.cap,sold:0}});return b} // idempotent: created once per Sunday, never carries over
const rem=(pid,sun)=>{const b=getBatch(sun)[pid];return Math.max(0,b.cap-b.sold)};
function placeOrder(cart,f,cust,rw){ // "server-side" order logic: re-validates everything
const c=cycle(now());
if(c.paused)return{ok:0,msg:S.settings.msg+' Ordering is paused.'};
if(!c.sched)return{ok:0,msg:'Ordering is closed. It reopens Monday 12:01 AM (Singapore time).'};
if(!cart.length)return{ok:0,msg:'Your cart is empty.'};
if(!cust.name||!cust.email)return{ok:0,msg:'Please enter your name and email.'};
if(f.type==='delivery'&&(f.day!=='sun'||!f.addr))return{ok:0,msg:'Delivery is Sunday only and needs an address.'};
const need={};cart.forEach(l=>need[l.pid]=(need[l.pid]||0)+l.qty);
for(const pid in need){const r=rem(pid,c.sunday);if(need[pid]>r)return{ok:0,msg:r?`Only ${r} left of ${prod(pid).name}, but you asked for ${need[pid]}. Reduce the quantity.`:`${prod(pid).name} is sold out for this week.`}}
const items=cart.map(l=>({pid:l.pid,name:prod(l.pid).name,slice:l.slice,qty:l.qty,price:prod(l.pid).price}));
const sub=items.reduce((a,i)=>a+i.price*i.qty,0),bal=S.points[cust.email]||0;let disc=0,cost=0;
if(rw==='r5'){cost=50;disc=5}else if(rw==='r10'){cost=100;disc=10}else if(rw&&rw.startsWith('free:')){cost=200;const p=items.find(i=>i.pid==rw.slice(5));if(!p)return{ok:0,msg:'Add the free-item product to your cart first.'};disc=p.price}
if(cost>bal)return{ok:0,msg:`Not enough points (${bal}).`};disc=Math.min(disc,sub);
const fee=f.type==='delivery'?+S.settings.fee:0,pts=Math.floor(sub-disc);
for(const pid in need)getBatch(c.sunday)[pid].sold+=need[pid]; // atomic: validate+deduct in one synchronous step
S.points[cust.email]=bal-cost+pts;
const o={id:'WL'+String(S.seq++).padStart(4,'0'),sun:c.sunday,placed:ft(now()),items,fulfil:f,name:cust.name,email:cust.email,sub,disc,fee,total:sub-disc+fee,status:'confirmed',pts,cost};
S.orders.push(o);save();return{ok:1,order:o}}
function setStatus(id,st){const o=S.orders.find(x=>x.id==id);if(!o||o.status===st)return;
if(st==='cancelled'&&o.status!=='cancelled'){if(iso(now())<=o.sun){const b=getBatch(o.sun);o.items.forEach(i=>b[i.pid].sold-=i.qty)}S.points[o.email]=(S.points[o.email]||0)-o.pts+o.cost}
if(o.status==='cancelled'&&st!=='cancelled'){const b=getBatch(o.sun);const need={};o.items.forEach(i=>need[i.pid]=(need[i.pid]||0)+i.qty);for(const k in need)if(need[k]>rem(k,o.sun))return alert('Not enough stock to reinstate.');o.items.forEach(i=>b[i.pid].sold+=i.qty);S.points[o.email]=(S.points[o.email]||0)+o.pts-o.cost}
o.status=st;save();go()}
const go=(v,a)=>{if(v){S.view=v;S.arg=a||''}save();render()};
function jump(d,h,m){S.demo=true;S.sim=cycle(now()).mon+d*D+(h*60+m)*6e4;go()}
const adv=m=>{S.demo=true;S.sim+=m*6e4;go()};
function useReal(){S.demo=false;go()}
function setLeft(pid,n){const c=cycle(now()),b=getBatch(c.sunday)[pid];b.sold=Math.max(0,b.cap-n);go()}
function rival(n){const r=placeOrder([{pid:'sourdough',slice:'whole',qty:n}],{type:'pickup',day:'sun'},{name:'Other customer',email:'other@demo.sg'},'');alert(r.ok?'Another customer bought '+n+' sourdough.':r.msg);go()}
function togglePause(){S.settings.paused=!S.settings.paused;go()}
// ---------- UI ----------
const money=n=>'S$'+(+n).toFixed(2).replace(/\.00$/,'');
function cd(){const t=now(),c=cycle(t);let s=Math.max(0,Math.floor((c.next-t)/1e3)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m '+s%60+'s'}
function statusBar(){const c=cycle(now()),sd=fd(c.sunday);
if(c.paused)return`<div class="bar shut"><b class="warn">${esc(S.settings.msg)}</b><span class="mut">Orders are paused by the bakery${S.settings.paused?'':' for this week'}. Browsing is still open.</span></div>`;
return`<div class="bar ${c.open?'open':'shut'}"><b class="${c.open?'ok':'warn'}">${c.open?'Orders are open':'Orders are closed'}</b><span>${c.label} <b class="cd">${cd()}</b></span><span class="mut">Batch: ${sd} baking</span></div>`}
function avail(p){const c=cycle(now()),r=rem(p.id,c.sunday);return{r,txt:r===0?'Sold Out for This Week':r<=5?`Only ${r} ${p.id=='sourdough'?'loaves':'left'==0?'':'units'} left for this week!`:`${r} of ${getBatch(c.sunday)[p.id].cap} left this week`}}
const cardP=p=>{const a=avail(p);return`<div class="card"><div class="pic">${p.emoji}</div><h3 style="margin:0">${esc(p.name)}</h3><div class="mut">${esc(p.desc)}</div><div class="row"><b>${money(p.price)}</b><span class="${a.r?(a.r<=5?'warn':'ok'):'warn'}">${a.txt}</span></div><button onclick="go('product','${p.id}')">${a.r?'View and order':'View'}</button></div>`};
function render(){const v=S.view,c=cycle(now()),N=[['home','Home'],['shop','Shop'],['story','Our Story'],['how','How to Order'],['account','Account & Rewards'],['admin','Admin'],['cart','Cart ('+S.cart.reduce((a,l)=>a+l.qty,0)+')']];
$nav.innerHTML='<b onclick="go(\'home\')">Wholesome Loafy</b>'+N.map(n=>`<a class="${v==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
const m={home,shop,product,cart,story,how,account,admin}[v]||home;$app.innerHTML=(v=='admin'?'':statusBar())+m(c)+`<p class="mut" style="margin-top:30px">Prototype: data lives only in this browser and payment is simulated. Not a production shop.</p>`;tick()}
function home(){return`<div class="hero"><h1>Wholesome Loafy</h1><p style="font-size:1.2rem;max-width:34ch">Slow-made bread, simple ingredients, everyday comfort.</p><p>A student-run bakery in Singapore. Small batches, baked fresh every Sunday.</p><button onclick="go('shop')">Shop now</button></div><h2>This week’s bakes</h2><div class="grid">${S.products.map(cardP).join('')}</div>`}
const shop=()=>`<h2>Shop</h2><p class="mut">Sunday baking batch: ${fd(cycle(now()).sunday)}. Each bread has a weekly limit; unsold units do not carry over.</p><div class="grid">${S.products.map(cardP).join('')}</div>`;
function product(c){const p=prod(S.arg);if(!p)return shop();const a=avail(p),inCart=S.cart.filter(l=>l.pid==p.id).reduce((x,l)=>x+l.qty,0),left=a.r-inCart,can=c.open&&left>0,i=p.info;
const why=c.paused?S.settings.msg:!c.sched?'Ordering is closed until Monday 12:01 AM.':a.r===0?'Sold out for this week.':left<=0?'Your cart already holds every remaining unit.':'';
return`<a onclick="go('shop')">← Shop</a><div class="card" style="margin-top:10px"><div class="pic">${p.emoji}</div><h2 style="margin:0">${esc(p.name)} <span class="mut">${money(p.price)}</span></h2><p>${esc(p.desc)}</p><p><b>Sunday Baking Batch, ${fd(c.sunday)}</b><br><span class="${a.r&&a.r<=5?'warn':''}">${a.txt}</span></p>
${p.slice?`<div class="row"><b>Would you like your sourdough sliced?</b><label><input type="radio" name="sl" value="sliced" checked> Sliced</label><label><input type="radio" name="sl" value="whole"> Unsliced (whole loaf)</label></div><div class="mut">No extra charge. Both choices share the same weekly stock.</div>`:''}
<div class="row"><label>Quantity <select id="qty" ${can?'':'disabled'}>${Array.from({length:Math.max(left,1)},(_,k)=>`<option>${k+1}</option>`).join('')}</select></label><button ${can?'':'disabled'} onclick="addCart('${p.id}')">Add to cart</button><span class="warn">${why}</span></div></div>
<div class="card" style="margin-top:14px">${[['Flavour & texture','flavour'],['Serving size','serving'],['Ingredients','ingredients'],['Nutritional information','nutrition'],['Allergen information','allergens'],['Storage & reheating','storage'],['Pre-order information','preorder']].map(x=>`<details><summary>${x[0]}</summary><p>${esc(i[x[1]])}</p></details>`).join('')}</div>`}
function addCart(pid){const p=prod(pid),q=+$('#qty').value,sl=p.slice?document.querySelector('input[name=sl]:checked').value:null,c=cycle(now());
const tot=S.cart.filter(l=>l.pid==pid).reduce((a,l)=>a+l.qty,0)+q;if(tot>rem(pid,c.sunday))return alert('Only '+rem(pid,c.sunday)+' left. Choose a smaller quantity.');
const ex=S.cart.find(l=>l.pid==pid&&l.slice==sl);ex?ex.qty+=q:S.cart.push({pid,slice:sl,qty:q});go('cart')}
const sl=s=>s==='sliced'?' (Sliced)':s==='whole'?' (Unsliced)':'';
function cart(c){const f=S.fulf=S.fulf||{type:'pickup',day:'sun'},sub=S.cart.reduce((a,l)=>a+l.qty*prod(l.pid).price,0),sun=c.sunday,mon=addD(sun,1),bal=S.points[S.email]||0;
if(!S.cart.length)return`<h2>Cart</h2><p>Your cart is empty. <a onclick="go('shop')">Browse the shop</a></p>`;
return`<h2>Cart and checkout</h2><div class="x"><table>${S.cart.map((l,k)=>`<tr><td>${esc(prod(l.pid).name)}${sl(l.slice)}</td><td><button class="sm alt" onclick="qchg(${k},-1)">−</button> ${l.qty} <button class="sm alt" onclick="qchg(${k},1)">+</button></td><td>${money(l.qty*prod(l.pid).price)}</td></tr>`).join('')}</table></div>
<div class="card" style="margin:14px 0"><b>Fulfilment for the ${fd(sun)} baking batch</b>
<div class="row"><label><input type="radio" name="ft" ${f.type=='pickup'&&f.day=='sun'?'checked':''} onchange="setF('pickup','sun')"> Pickup ${fd(sun)} (free)</label><label><input type="radio" name="ft" ${f.type=='pickup'&&f.day=='mon'?'checked':''} onchange="setF('pickup','mon')"> Pickup ${fd(mon)} (free)</label><label><input type="radio" name="ft" ${f.type=='delivery'?'checked':''} onchange="setF('delivery','sun')"> Delivery ${fd(sun)} (${money(S.settings.fee)})</label></div>
<div class="mut">${f.type=='delivery'?'Hours: '+esc(S.settings.delHours)+'. Area: '+esc(S.settings.area):'Pickup times: '+esc(S.settings.pickupTimes)}</div>${f.type=='delivery'?'<div class="row"><input id="addr" placeholder="Delivery address" style="width:100%" value="'+esc(f.addr||'')+'" onchange="S.fulf.addr=this.value"></div>':''}</div>
<div class="row"><input id="cn" placeholder="Name" value="${esc(S.cname||'')}" onchange="S.cname=this.value"><input id="ce" type="email" placeholder="Email" value="${esc(S.email)}" onchange="S.email=this.value.trim().toLowerCase();render()"></div>
<div class="row"><label>Loafy Points reward (balance ${bal}) <select id="rw"><option value="">None</option><option value="r5">50 pts: S$5 off</option><option value="r10">100 pts: S$10 off</option>${S.products.map(p=>`<option value="free:${p.id}">200 pts: free ${esc(p.name)}</option>`).join('')}</select></label></div>
<p>Subtotal ${money(sub)}${f.type=='delivery'?' + delivery '+money(S.settings.fee):''}. Discounts apply when you place the order. <span class="mut">Payment is simulated; no card details are collected.</span></p>
<button ${c.open?'':'disabled'} onclick="checkout()">Place order (simulated payment)</button> <span class="warn">${c.open?'':'Checkout is disabled while ordering is closed.'}</span>`}
function qchg(k,d){const l=S.cart[k];l.qty+=d;if(l.qty<=0)S.cart.splice(k,1);go()}
function setF(t,d){S.fulf={type:t,day:d,addr:(S.fulf||{}).addr};go()}
function checkout(){const r=placeOrder(S.cart,{...S.fulf,addr:S.fulf.addr||''},{name:S.cname||'',email:S.email||''},$('#rw').value);
if(!r.ok)return alert(r.msg);S.cart=[];S.view='account';go();alert('Order '+r.order.id+' confirmed. You earned '+r.order.pts+' Loafy Points.')}
const story=()=>`<h2>Our story</h2><p style="max-width:62ch">Wholesome Loafy began in a student kitchen with one question: what if bread was made slowly, in small batches, with ingredients you can pronounce? We are students, baking between lectures, and every loaf is made to order so nothing is wasted. (Sample story text. Replace with your own.)</p>`;
const how=()=>`<h2>How to order</h2><div class="x"><table><tr><th>When (Singapore time)</th><th>What happens</th></tr><tr><td>Mon 12:01 AM</td><td>Pre-orders open; every bread gets a fresh 20 units</td></tr><tr><td>Tue–Thu</td><td>Keep ordering while stock lasts</td></tr><tr><td>Fri 11:59 PM</td><td>Last minute to order</td></tr><tr><td>Saturday</td><td>Ordering closed; ingredients bought</td></tr><tr><td>Sunday</td><td>Baking day: pickup or local delivery</td></tr><tr><td>Following Monday</td><td>Remaining pickups from Sunday’s batch (a new ordering week has already opened)</td></tr></table></div>`;
function account(){const e=S.email,os=S.orders.filter(o=>o.email==e),bal=S.points[e]||0;
return`<h2>My account and rewards</h2><div class="row"><input id="ae" type="email" placeholder="Your email" value="${esc(e)}"><button onclick="S.email=$('#ae').value.trim().toLowerCase();go()">Show my account</button></div>${e?`<p><b>${bal} Loafy Points</b>. Earn 1 point per S$1 spent. Redeem at checkout: 50 pts = S$5 off, 100 pts = S$10 off, 200 pts = a free bread.</p>
<h3>Purchase history</h3>${os.length?`<div class="x"><table>${os.slice().reverse().map(o=>`<tr><td>${o.id}<br><span class="mut">${o.placed}</span></td><td>${o.items.map(i=>i.qty+'× '+esc(i.name)+sl(i.slice)).join('<br>')}</td><td>${fd(o.sun)} batch<br>${o.fulfil.type} ${o.fulfil.day=='mon'?fd(addD(o.sun,1)):fd(o.sun)}</td><td>${money(o.total)}<br>${o.status}</td></tr>`).join('')}</table></div>`:'<p>No orders yet.</p>'}`:'<p>Enter the email you used at checkout. (Demo only: no password.)</p>'}`}
// ---------- admin ----------
const ST=['pending','confirmed','baking','ready for pickup','fulfilled','cancelled'];
function admin(c){const T=[['orders','Orders'],['products','Products & stock'],['settings','Settings & pause'],['shop','Shopping list']];
return`<h2>Admin dashboard <span class="mut" style="font-size:.8rem">(prototype: no login)</span></h2>${statusBar()}<div class="tabs">${T.map(t=>`<button class="${S.tab==t[0]?'':'alt'}" onclick="S.tab='${t[0]}';go()">${t[1]}</button>`).join('')}</div>`+({orders:aOrders,products:aProducts,settings:aSettings,shop:aShop}[S.tab])(c)}
function batchSums(sun){const o={};S.orders.filter(x=>x.sun==sun&&x.status!='cancelled').forEach(x=>x.items.forEach(i=>{const k=i.pid;o[k]=o[k]||{n:0,s:0,w:0};o[k].n+=i.qty;if(i.slice=='sliced')o[k].s+=i.qty;if(i.slice=='whole')o[k].w+=i.qty}));return o}
function aOrders(c){const suns=[...new Set([c.sunday,...S.orders.map(o=>o.sun)])].sort().reverse();return suns.map(s=>{const sm=batchSums(s),b=getBatch(s);return`<div class="card" style="margin-bottom:14px"><h3 style="margin:0">Baking batch: ${fd(s)} ${s==c.sunday?'(current)':''}</h3>
<div class="x"><table><tr><th>Bread</th><th>Ordered</th><th>Sliced / unsliced</th><th>Remaining</th></tr>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${(sm[p.id]||{n:0}).n}</td><td>${p.slice?(sm[p.id]||{s:0}).s+' / '+(sm[p.id]||{w:0}).w:'n/a'}</td><td>${b[p.id].cap-b[p.id].sold} of ${b[p.id].cap}</td></tr>`).join('')}</table></div>
${S.orders.filter(o=>o.sun==s).map(o=>`<details><summary>${o.id}: ${esc(o.name)}, ${money(o.total)}, ${o.status}</summary><div>${o.items.map(i=>i.qty+'× '+esc(i.name)+sl(i.slice)).join(', ')}<br>${o.fulfil.type=='delivery'?'Delivery '+fd(o.sun)+', '+esc(o.fulfil.addr):'Pickup '+(o.fulfil.day=='mon'?fd(addD(o.sun,1)):fd(o.sun))}<br>${esc(o.email)}<br><select onchange="setStatus('${o.id}',this.value)">${ST.map(x=>`<option ${x==o.status?'selected':''}>${x}</option>`).join('')}</select></div></details>`).join('')||'<p class="mut">No orders for this batch.</p>'}</div>`}).join('')}
function aProducts(c){return S.products.map(p=>`<div class="card" style="margin-bottom:14px"><div class="row"><b>${p.emoji}</b><input value="${esc(p.name)}" onchange="upd('${p.id}','name',this.value)"> <label>Price S$<input type="number" step="0.5" style="width:80px" value="${p.price}" onchange="upd('${p.id}','price',+this.value)"></label><label>Weekly limit <input type="number" style="width:70px" value="${p.cap}" onchange="upd('${p.id}','cap',+this.value)"></label><span class="mut">Left now: ${rem(p.id,c.sunday)}</span></div>
<textarea rows="2" onchange="upd('${p.id}','desc',this.value)">${esc(p.desc)}</textarea>
${Object.keys(p.info).map(k=>`<div class="mut">${k}</div><textarea rows="2" onchange="updI('${p.id}','${k}',this.value)">${esc(p.info[k])}</textarea>`).join('')}
<div class="mut">Recipe per 1 unit, one line each: ingredient, quantity, unit (e.g. “Bread flour, 500, g”). Left empty on purpose; nothing is invented.</div><textarea rows="3" onchange="upd('${p.id}','recipe',this.value)">${esc(p.recipe)}</textarea></div>`).join('')+'<p class="mut">Limit changes apply to the current batch (never below units already sold) and to future weeks. Images are emoji placeholders in this prototype.</p>'}
function upd(id,k,v){const p=prod(id);p[k]=v;if(k=='cap'){const b=getBatch(cycle(now()).sunday)[id];b.cap=Math.max(v,b.sold)}save();render()}
function updI(id,k,v){prod(id).info[k]=v;save()}
function aSettings(){const s=S.settings,c=cycle(now()),sd=[0,1,2,3].map(i=>addD(c.sunday,7*i));
return`<div class="card"><h3 style="margin-top:0">Manual pause (overrides the weekly schedule)</h3><div class="row"><button onclick="togglePause()">${s.paused?'Resume ordering':'Pause all orders now'}</button><span>${s.paused?'<b class="warn">Paused</b>':'<b class="ok">Running on schedule</b>'}</span></div><div class="row"><input style="width:100%" value="${esc(s.msg)}" onchange="S.settings.msg=this.value;save()"></div>
<b>Pause a future baking week</b><div class="row">${sd.map(d=>`<label><input type="checkbox" ${s.pauseWeeks.includes(d)?'checked':''} onchange="pw('${d}',this.checked)"> ${fd(d)} batch</label>`).join('')}</div></div>
<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Fulfilment</h3><div class="row"><label>Delivery fee S$<input type="number" step="0.5" style="width:80px" value="${s.fee}" onchange="S.settings.fee=+this.value;save()"></label></div><div class="mut">Pickup times</div><input style="width:100%" value="${esc(s.pickupTimes)}" onchange="S.settings.pickupTimes=this.value;save()"><div class="mut">Delivery hours</div><input style="width:100%" value="${esc(s.delHours)}" onchange="S.settings.delHours=this.value;save()"><div class="mut">Service area</div><input style="width:100%" value="${esc(s.area)}" onchange="S.settings.area=this.value;save()"></div>`}
function pw(d,on){const a=S.settings.pauseWeeks;if(on&&!a.includes(d))a.push(d);if(!on)S.settings.pauseWeeks=a.filter(x=>x!=d);save();render()}
function aShop(c){const sun=S.shopSun||c.sunday,suns=[...new Set([c.sunday,...S.orders.map(o=>o.sun)])].sort(),need={};
S.orders.filter(o=>o.sun==sun&&['confirmed','baking','ready for pickup','fulfilled'].includes(o.status)).forEach(o=>o.items.forEach(i=>need[i.pid]=(need[i.pid]||0)+i.qty));
const tot={};S.products.forEach(p=>{(p.recipe||'').split('\n').forEach(l=>{const [n,q,u]=l.split(',').map(x=>x.trim());if(n&&q&&!isNaN(+q)&&need[p.id]){const k=n+'|'+(u||'');tot[k]=(tot[k]||0)+q*need[p.id]}})});
return`<div class="row"><label>Batch <select onchange="S.shopSun=this.value;go()">${suns.map(s=>`<option value="${s}" ${s==sun?'selected':''}>${fd(s)}</option>`).join('')}</select></label></div><p>Confirmed production: ${S.products.map(p=>(need[p.id]||0)+' '+esc(p.name)).join('; ')}</p>
${Object.keys(tot).length?`<h3>Saturday shopping list</h3><ul>${Object.entries(tot).map(([k,v])=>`<li>${esc(k.split('|')[0])}: ${Math.round(v*100)/100} ${esc(k.split('|')[1])}</li>`).join('')}</ul>`:'<p class="mut">No list yet. Enter recipe quantities per product in “Products & stock”; pending and cancelled orders are excluded.</p>'}`}
// ---------- tests ----------
function runTests(){const bak=JSON.stringify(S);S=defaults();S.demo=true;const out=[],t=(n,c)=>out.push(`<div>${c?'✅':'❌'} ${n}</div>`);
const at=(d,h,m)=>{S.sim=Date.UTC(2026,9,26)+d*D+(h*60+m)*6e4},sun1='2026-11-01',sun2='2026-11-08',O=(pid,q,sl,type,day)=>placeOrder([{pid,slice:sl||null,qty:q}],{type:type||'pickup',day:day||'sun',addr:'x'},{name:'T',email:'t@t.sg'},'');
at(0,0,0);t('Mon 12:00 AM: ordering closed',!cycle(S.sim).open);at(0,0,1);t('Mon 12:01 AM: ordering opens',cycle(S.sim).open);
t('Fresh batch has exactly 20 per product',S.products.every(p=>rem(p.id,sun1)==20));
at(2,12,0);O('sourdough',17,'sliced');t('Wed: 3 sourdough remaining',rem('sourdough',sun1)==3);
let r=O('sourdough',4,'sliced');t('Buying 4 of 3 is blocked with a message',!r.ok&&/Only 3/.test(r.msg));
O('sourdough',2,'sliced');O('sourdough',1,'whole');t('Sliced and unsliced share one stock; reaches 0 (sold out)',rem('sourdough',sun1)==0);
const rr=[O('focaccia',20),0];t('Two orders for the last units: only one succeeds',(()=>{const a=O('cinnamon',1),b=(setLeft2('cinnamon',1),[O('cinnamon',1),O('cinnamon',1)]);return b[0].ok&&!b[1].ok&&rem('cinnamon',sun1)==0})());
function setLeft2(p,n){const b=getBatch(sun1)[p];b.sold=b.cap-n}
const oid=S.orders[S.orders.length-1];setStatus(S.orders.find(o=>o.items[0].pid=='cinnamon').id,'cancelled');t('Cancelling restores stock to the right batch',rem('cinnamon',sun1)==1);
at(4,23,59);t('Fri 11:59 PM: final ordering minute',cycle(S.sim).open);at(5,0,0);t('Sat 12:00 AM: ordering closed',!cycle(S.sim).open&&O('focaccia',1).ok===0);
at(6,10,0);t('Sunday: ordering closed',!cycle(S.sim).open);
at(7,0,1);t('Next Monday: new batch has exactly 20 (no carry-over)',rem('cinnamon',sun2)==20&&rem('sourdough',sun2)==20);getBatch(sun2);t('Reset is idempotent (no double replenish)',rem('sourdough',sun2)==20);
t('Old orders remain saved',S.orders.length>3&&S.orders[0].sun==sun1);
t('Monday pickup still maps to previous Sunday batch',S.orders[0].sun==sun1&&addD(S.orders[0].sun,1)=='2026-11-02');
at(8,9,0);S.settings.paused=true;t('Admin pause blocks ordering despite schedule',!cycle(S.sim).open&&!O('focaccia',1).ok);S.settings.paused=false;
t('Delivery on Monday is rejected',!O('focaccia',1,null,'delivery','mon').ok);
S=JSON.parse(bak);$('#tests').innerHTML=out.join('');render()}
// ---------- boot ----------
const $=s=>document.querySelector(s),$nav=$('#nav'),$app=$('#app');
function tick(){$('#dclk').textContent=(S.demo?'DEMO ':'REAL ')+ft(now());document.querySelectorAll('.cd').forEach(e=>e.textContent=cd())}
setInterval(()=>{if(!S.demo)S.sim=now();tick();if(cycle(now()).open!==window._o){window._o=cycle(now()).open;render()}},1000);
render();
</script></body></html>
